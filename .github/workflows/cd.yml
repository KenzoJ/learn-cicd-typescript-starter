name: Deploy

on:
  push:
    branches: [main]


jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26 

      - name: Install ts 
        run: npm install typescript
        
      - name: Install dependencies
        run: npm run build
        
  
