name: Deploy

on:
  push:
    branches: [main]


jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26 

      - name: Install ts 
        run: npm install typescript
        
      - name: Install dependencies
        run: npm run build
        
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: Push docker image to gcloud
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-500820/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-500820/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-500820  --max-instances=4
